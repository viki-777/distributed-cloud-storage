version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dcs_metadata
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcs -d dcs_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8080:8080"
      - "50050:50050"
    environment:
      DATABASE_URL: postgres://dcs:secret@postgres:5432/dcs_metadata
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      GRPC_PORT: "50050"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node1:
    hostname: node-001
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-001
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      COORDINATOR_GRPC_URL: coordinator:50050
      STORAGE_DIR: /data/chunks
    ports:
      - "50051:50051"
    volumes:
      - node1_data:/data/chunks
    depends_on:
      - coordinator

  node2:
    hostname: node-002
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-002
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      COORDINATOR_GRPC_URL: coordinator:50050
      STORAGE_DIR: /data/chunks
    ports:
      - "50052:50051"
    volumes:
      - node2_data:/data/chunks
    depends_on:
      - coordinator

  node3:
    hostname: node-003
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-003
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      COORDINATOR_GRPC_URL: coordinator:50050
      STORAGE_DIR: /data/chunks
    ports:
      - "50053:50051"
    volumes:
      - node3_data:/data/chunks
    depends_on:
      - coordinator

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  pg_data:
  node1_data:
  node2_data:
  node3_data:
  prometheus_data:
  grafana_data:
