version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dcs_metadata
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcs -d dcs_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dcs:secret@postgres:5432/dcs_metadata
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node1:
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-001
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      STORAGE_DIR: /data/chunks
    ports:
      - "50051:50051"
    volumes:
      - node1_data:/data/chunks
    depends_on:
      - coordinator

  node2:
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-002
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      STORAGE_DIR: /data/chunks
    ports:
      - "50052:50051"
    volumes:
      - node2_data:/data/chunks
    depends_on:
      - coordinator

  node3:
    build:
      context: .
      dockerfile: storagenode/Dockerfile
    environment:
      NODE_ID: node-003
      GRPC_PORT: "50051"
      COORDINATOR_URL: http://coordinator:8080
      STORAGE_DIR: /data/chunks
    ports:
      - "50053:50051"
    volumes:
      - node3_data:/data/chunks
    depends_on:
      - coordinator

volumes:
  pg_data:
  node1_data:
  node2_data:
  node3_data:
