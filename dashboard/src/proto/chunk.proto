syntax = "proto3";
package dcs;
option go_package = "github.com/viki-777/distributed-cloud-storage/proto/dcs";

service ChunkService {
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
  rpc DownloadChunk(DownloadChunkRequest) returns (DownloadChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
}

message UploadChunkRequest {
  string chunk_id = 1;
  bytes  data     = 2;
  string checksum = 3;
}

message UploadChunkResponse {
  bool   success  = 1;
  string chunk_id = 2;
}

message DownloadChunkRequest {
  string chunk_id = 1;
}

message DownloadChunkResponse {
  bytes  data     = 1;
  string checksum = 2;
}

message DeleteChunkRequest  { string chunk_id = 1; }
message DeleteChunkResponse { bool success    = 1; }
message VerifyChunkRequest  { string chunk_id = 1; }
message VerifyChunkResponse { bool exists = 1; string checksum = 2; }
