global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'dcs-coordinator'
    static_configs:
      - targets: ['coordinator:9090']

  - job_name: 'dcs-storage-nodes'
    static_configs:
      - targets:
        - 'node1:9091'
        - 'node2:9091'
        - 'node3:9091'
